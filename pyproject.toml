[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "항공권부터 식당까지, 순서대로 계획하는 여행 에이전트"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
travel-agent = "travel_agent.server:main"

[tool.setuptools.package-data]
travel_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
